
name: Aegis Portfolio Initialization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Initialize virtual portfolio
        run: |
          python portfolio_initializer.py

      - name: Commit simulation ledger
        run: |
          git config user.name "Aegis Bot"
          git config user.email "aegis-bot@users.noreply.github.com"
          git add simulation_ledger.json
          git diff --cached --quiet || (
            git commit -m "Initialize Aegis virtual portfolio"
            git push
          )
