
name: Aegis Portfolio Initialization

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/initialize-paper-portfolio.yml"
      - "portfolio_initializer.py"
      - "market_data.py"
      - "simulation_engine.py"

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest

    steps:
      - name: Verify main branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" != "main" ]; then
            echo "ERROR: Initialization is only allowed on main."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install market data dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance

      - name: Protect existing ledger
        run: |
          if [ -e simulation_ledger.json ]; then
            echo "ERROR: simulation_ledger.json already exists."
            exit 1
          fi

      - name: Initialize verified paper portfolio
        run: |
          python portfolio_initializer.py \
            --date "2026-11-17" \
            --confirm

      - name: Commit initial ledger
        run: |
          git config user.name "Aegis Bot"
          git config user.email "aegis-bot@users.noreply.github.com"
          git add -- simulation_ledger.json
          git diff --cached --quiet || (
            git commit -m "Initialize Aegis paper portfolio"
            git push origin HEAD:main
          )
