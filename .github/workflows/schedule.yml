name: Aegis Research Daily Run

on:
  schedule:
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

jobs:
  run-analyst:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install google-genai yfinance

      - name: Wake up Aegis Research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_agent.py

      - name: Save Briefing and Memory
        run: |
          git config --global user.name "Aegis Research Bot"
          git config --global user.email "bot@://github.com"
          git add memory.json latest_briefing.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aegis daily briefing update" && git push)
